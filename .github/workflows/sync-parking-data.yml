name: Sync nationwide parking data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 1 * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch parking information
        env:
          DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
        run: python scripts/sync_parking.py

      - name: Commit updated data snapshot
        run: |
          if git diff --quiet -- data/parking_lots.json; then
            echo "Parking data did not change."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/parking_lots.json
          git commit -m "Update nationwide parking data"
          git push
